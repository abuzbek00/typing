<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tez yozish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#27384c;--muted:#7b8b9d;--line:#dbe3ec;--blue:#3b8fdc;--blue2:#1f6fba;--t1:#5bb3ef;--t2:#2f86d4;--yel:#fdb930;--red:#e5233d;--kl:#d9822b;--band:#bccfee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#fff;--ink:#27384c;--muted:#7b8b9d;--line:#dbe3ec;--blue:#3b8fdc;--blue2:#1f6fba;--t1:#5bb3ef;--t2:#2f86d4;--kl:#d9822b;--band:#bccfee}
:root[data-theme="dark"]{--bg:#0d1623;--surface:#152133;--ink:#e4edf8;--muted:#8a9db6;--line:#25364f;--blue:#2b6fb5;--blue2:#1c4f86;--t1:#235a96;--t2:#173f6e;--kl:#f0a060;--band:#24416b}
:root[data-theme="pixel"]{--bg:#eef4e6;--surface:#fffef8;--ink:#23301f;--muted:#66765e;--line:#cddcbf;--blue:#2c8040;--blue2:#1d6030;--t1:#4b86e8;--t2:#2f5fc0;--kl:#b8651a;--band:#bfe0a8}
:root[data-theme="garden"]{--bg:#fbf1f8;--surface:#fff;--ink:#3b2340;--muted:#86698c;--line:#ecd4e6;--blue:#c2468f;--blue2:#9a2f70;--t1:#c9559f;--t2:#8f45b8;--kl:#c0562a;--band:#f0c9e4}
:root[data-theme="race"]{--bg:#140a10;--surface:#221219;--ink:#f7ebe6;--muted:#b8999a;--line:#3b2029;--blue:#d93a22;--blue2:#ff7b5a;--t1:#34111c;--t2:#1a0a12;--kl:#ffb067;--band:#4a1b26}
:root[data-theme="toon"]{--bg:#f3eefc;--surface:#fff;--ink:#2b2248;--muted:#74699a;--line:#ddd3f2;--blue:#7040d0;--blue2:#5128a8;--t1:#8f5fe6;--t2:#4f74d6;--kl:#d6641e;--band:#d3c4f5}
:root[data-theme="city"]{--bg:#f6efe9;--surface:#fff;--ink:#33281f;--muted:#806f61;--line:#e6d8cb;--blue:#b85a14;--blue2:#8f430c;--t1:#4d3b86;--t2:#b4523a;--kl:#b85a14;--band:#f0d0b4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;min-height:100vh}
.top{position:relative;isolation:isolate;background:linear-gradient(var(--t1),var(--t2));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.top::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--hero,none) right bottom/auto 56% repeat-x;opacity:.55}
.top .ddm{text-shadow:none}
.top .in{max-width:1000px;margin:0 auto;padding:12px 20px}
.top1{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top2{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:14px;padding-bottom:18px}
.nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.nav button{color:#fff;opacity:.85}
.nav button:hover,.nav button[aria-pressed="true"]{opacity:1;background:rgba(255,255,255,.2);color:#fff}
.nav button.cur{opacity:1;text-decoration:underline;text-underline-offset:6px}
.nav .pill{background:rgba(0,0,0,.25);opacity:1;font-weight:800;color:#fff}
.nav .signup{background:#fff;color:var(--blue2);opacity:1;font-weight:800;border:2px solid #fff}
.nav .signup:hover{background:#fff;color:var(--blue2)}
.sep{width:1px;height:20px;background:rgba(255,255,255,.4);margin:0 6px}
.dd{position:relative}
.ddm{position:absolute;top:100%;left:0;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.nav .ddm button{display:block;width:100%;text-align:left;color:var(--ink);opacity:1;background:none}
.nav .ddm button:hover{background:var(--bg);color:var(--ink)}
.logo{font-size:24px;font-weight:800;color:#fff;padding:4px 6px}
.avc{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.7);overflow:hidden;flex:none}
.avc svg{width:100%;height:100%}
.lvl{flex:1;min-width:180px;max-width:320px}
.lvl .bar{background:rgba(255,255,255,.35);height:20px;border-radius:99px;position:relative;overflow:hidden}
.lvl .bar b{position:absolute;inset:0 auto 0 0;background:var(--yel);width:0}
.lvl .bar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:20px;color:#223}
.chips{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{line-height:1.15}.chip b{display:block;font-size:20px}.chip span{font-size:11px;opacity:.85}
.coins{font-weight:800;background:rgba(255,255,255,.2);border-radius:999px;padding:8px 16px}
main{max-width:1000px;margin:0 auto;padding:24px 20px 32px}
footer{max-width:1000px;margin:0 auto;padding:16px 20px 32px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
button{font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.home{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.side h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.side button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:14px;margin-bottom:6px;border-radius:10px}
.side button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{background:var(--blue);border-radius:14px;padding:14px}
.prog{background:rgba(255,255,255,.35);border-radius:6px;height:22px;position:relative;overflow:hidden;margin-bottom:14px}
.prog b{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.9;width:0}
.prog span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:22px;color:var(--blue2)}
.panel h4{margin:16px 4px 10px;color:#fff;font-size:15px}
.ls{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.ls .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.ls.done .n{background:var(--blue);border-color:var(--blue);color:#fff}
.ls .tt{font-weight:600;font-size:15px}.ls .tt .kl{color:var(--kl)}
.ls .go{margin-left:auto;font-size:13px;font-weight:800;padding:7px 18px;border-radius:6px;background:var(--yel);color:#2a2a2a;flex:none}
.ls .go:hover{color:#2a2a2a;filter:brightness(1.05)}
.ls .go:disabled{background:color-mix(in srgb,var(--blue) 35%,var(--surface));color:#fff;cursor:not-allowed;opacity:.8}
.ls .go.re{background:color-mix(in srgb,var(--blue) 22%,var(--surface));color:var(--blue2)}
.ls .tm{font-size:12px;color:var(--muted);flex:none}
.free{background:var(--surface);border-radius:10px;padding:20px}
.free h2{margin:0 0 12px;font-size:17px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.row button{border:1px solid var(--line);color:var(--ink)}
.row button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.small{font-size:13px;color:var(--muted)}
.mb{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.mb b{display:block;height:100%;background:var(--blue);width:0}
.primary{background:var(--blue);color:#fff;padding:13px 26px;font-size:16px;border-radius:10px;font-weight:800}
.primary:hover{color:#fff;filter:brightness(1.08)}
.ghost{border:2px solid var(--blue);color:var(--blue);padding:11px 24px;font-size:16px;border-radius:10px}
.live{display:flex;gap:28px;align-items:baseline;font-size:32px;font-weight:800;margin-bottom:10px;font-variant-numeric:tabular-nums;color:var(--blue)}
.live small{font-size:14px;font-weight:600;color:var(--muted);margin-left:6px}
.live .ttl{margin-left:auto;font-size:15px;font-weight:600;color:var(--ink);text-align:right}
.stage{position:relative;cursor:text;padding:24px 28px}
.view{height:calc(1.9em*3);overflow:hidden;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:24px;line-height:1.9;color:var(--muted)}
.text{transition:transform .12s ease;overflow-wrap:break-word}
.text span{position:relative}
.text .ok{color:var(--ink)}
.text .bad{color:var(--red);background:color-mix(in srgb,var(--red) 16%,transparent);border-radius:3px}
.text .cur::before{content:"";position:absolute;left:-1px;top:.25em;bottom:.25em;width:2px;background:var(--blue);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.text .cur::before{animation:none}.text{transition:none}}
.blur-note{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--surface) 90%,transparent);border-radius:14px;color:var(--muted);font-weight:600}
.stage.blurred .blur-note{display:flex}
#hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.hint{margin:14px 0 0;color:var(--muted);font-size:14px;text-align:center}
#kb{margin-top:16px}
#kb svg{width:100%;max-width:680px;display:block;margin:0 auto;overflow:hidden}
.kbbg{fill:var(--line)}
.key rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.key text{font:600 15px "JetBrains Mono",monospace;fill:var(--muted);text-transform:uppercase}
.key.nx rect{fill:var(--blue);stroke:var(--blue2)}
.key.nx text{fill:#fff}
.hand{fill:#d98c8c;opacity:.45}
.ovg .ov{fill:#1f7fd1;opacity:.5;display:none}
.ovg .ov.on{display:block}
.det .cr{fill:none;stroke:#8a4a4a;stroke-width:1.5;stroke-linecap:round;opacity:.35}
.det .nl{fill:#fff;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat b{display:block;font-size:38px;font-weight:800;line-height:1.1;color:var(--blue)}
.msg{margin:0 0 20px;font-weight:600;line-height:1.6}
.cert{border:3px double var(--blue);border-radius:12px;padding:22px;text-align:center;margin-bottom:20px;background:var(--surface)}
.cert h3{margin:6px 0;font-size:26px}
h2.h{margin:0 0 14px;font-size:20px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{text-align:center;padding:14px}
.item svg{width:96px;height:104px}
.sw{width:96px;height:64px;border-radius:10px;margin:20px auto;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:flex-end;padding:8px}
.sw i{width:22px;height:22px;border-radius:50%;display:block}
.item p{margin:6px 0;font-weight:600;font-size:14px}
.item button{border:1px solid var(--line);width:100%;color:var(--ink)}
.item button.can{background:var(--blue);color:#fff;border-color:var(--blue)}
.item button:disabled{opacity:.5;cursor:default}
/* tests page */
.t1{font-size:30px;font-weight:800;margin:0 0 4px;line-height:1.15}
.tsub{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 14px}
.tp{font-size:13px;line-height:1.6;margin:0 0 10px;max-width:820px}
.band{background:var(--band);border-radius:6px;padding:16px;display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;margin-bottom:12px}
.band h3{margin:0;color:#fff;font-size:28px;font-weight:800;line-height:1.1}
.tcs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tc{position:relative;background:var(--surface);padding:30px 10px 12px;text-align:center;border-top:14px solid color-mix(in srgb,var(--band) 60%,var(--surface));margin-top:16px;border-radius:3px}
.tc .ic{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:var(--surface);border:2px solid var(--blue);display:flex;align-items:center;justify-content:center}
.tc b{display:block;font-size:17px;margin-bottom:2px}
.tc .bs{font-size:11px;color:var(--muted);margin-bottom:8px}
.tc .tb{width:100%;background:#ffdfa5;border:1px solid #d9a54e;color:#5e4210;font-size:11px;font-weight:700;padding:7px;border-radius:4px}
.tc .tb:hover{background:#e9a393;color:#4a1d12}
.faq{margin-top:28px;background:#2f3b42;color:#fff;border-radius:10px;padding:22px}
.faq h2{margin:0 0 10px;font-size:30px}
.faq details{border-top:1px solid rgba(255,255,255,.2);padding:14px 0}
.faq summary{cursor:pointer;font-size:17px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"\25BE";opacity:.7}
.faq details[open] summary::after{content:"\25B4"}
.faq p{margin:10px 0 0;font-size:14px;line-height:1.6;opacity:.85}
/* progress */
.pg{display:grid;grid-template-columns:210px 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);min-height:420px}
.pgs{border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.pgs button{display:block;width:100%;text-align:left;border-radius:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:13px;padding:14px 14px}
.pgs button.on{background:var(--blue);color:#fff;font-weight:800}
.pgm{padding:24px}
.pgm h2{margin:0 0 16px;font-size:26px}
.ach{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-weight:700;font-size:14px;background:linear-gradient(to right,color-mix(in srgb,var(--blue) 80%,transparent) var(--p,0%),var(--surface) var(--p,0%));color:var(--ink);text-align:left;width:100%}
.ach.big{margin-bottom:12px;font-size:16px}
.ach span{font-size:11px;font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent);padding:0 4px;border-radius:3px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:8px;padding:10px 8px;font-size:12px;text-align:center;color:var(--muted)}
.bd.e{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
/* games */
.gban{display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--band);border-radius:6px;padding:20px;margin-bottom:12px}
.gban h2{margin:0 0 8px;font-size:26px;line-height:1.15}
.gban p{margin:0;font-size:13px;line-height:1.6;max-width:640px}
.gban svg{width:110px;height:110px;flex:none}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gt{position:relative;height:150px;border-radius:8px;border:4px solid var(--line);overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center;text-align:center}
.gt span{font-size:28px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);padding:0 10px;line-height:1.1}
.gt:hover{border-color:var(--yel);color:#fff}
.gt-fruit,.g-fruit{background:linear-gradient(#7a4a2a,#b47a45)}
.gt-jump,.g-jump{background:linear-gradient(#8fd0f5,#d6f0ff 70%,#6aa84f 70%)}
.gt-zombie,.g-zombie{background:linear-gradient(#5e9a3f,#3f7a2c)}
.gt-ztype,.g-ztype{background:radial-gradient(circle at 70% 40%,#7a2a4a,#0b0b1f 60%)}
.gt-balloon,.g-balloon{background:linear-gradient(#78c6f5,#d9f1ff)}
.gt-toss,.g-toss{background:linear-gradient(#8b1a2b,#c23a4a)}
.gst{position:relative;height:360px;overflow:hidden;padding:0}
.it{position:absolute;left:0;top:0;padding:3px 14px;border-radius:999px;font:600 20px "JetBrains Mono",monospace;white-space:nowrap;color:#fff;background:var(--blue);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.it b{color:var(--yel)}
.it-fruit{width:56px;height:56px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:26px;text-transform:uppercase}
.it-jump{width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#7a5230;font-size:22px;text-transform:uppercase}
.it-zombie{background:#4c8a3c;border-radius:10px;border:2px solid #2d5a24}
.it-ztype{background:#b3243a;border:2px solid #ffb3c0}
.it-balloon{border-radius:50% 50% 46% 46%;padding:14px 18px}
.it-toss{background:#ffcc33;color:#5a3a00;border-radius:16px;font-weight:800}
.plr{position:absolute;left:30px;bottom:28px;width:40px;height:50px;background:#2b5fb5;border-radius:8px;transition:transform .25s}
.plr.jmp{transform:translateY(-70px)}
.gbase{position:absolute;left:0;top:0;bottom:0;width:12px;background:#6b4a2a}
.gover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:20px;line-height:1.6;padding:20px;background:color-mix(in srgb,var(--surface) 90%,transparent);z-index:3;color:var(--ink)}
#gin{flex:1;min-width:200px;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--blue);border-radius:10px;background:var(--surface);color:var(--ink)}
dialog{border:0;border-radius:14px;padding:22px;max-width:360px;width:90%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dn{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--blue);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:10px}
.pf{display:block;width:100%;text-align:left;border:1px solid var(--line);color:var(--ink);margin-bottom:6px}
/* theme gallery */
dialog.thd{max-width:780px;width:94vw;padding:18px;max-height:92vh;overflow:auto}
.thg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.thc{padding:0;border:3px solid transparent;border-radius:14px;background:var(--surface);position:relative;overflow:hidden;text-align:left;display:block}
.thc:hover{border-color:var(--line)}
.thc.on{border-color:var(--blue)}
.thp{display:block;position:relative;height:132px;border-radius:11px;overflow:hidden}
.thp svg{position:absolute;inset:0;width:100%;height:100%}
.thn{position:absolute;left:10px;top:8px;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.thk{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;display:none;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.thc.on .thk{display:flex}
.thf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.thf span{font-weight:700;color:var(--muted);text-align:center}
.thx{border:2px solid var(--line);color:var(--ink)}
.thy{background:var(--yel);color:#2a2a2a;font-weight:800;padding:10px 22px;border-radius:10px}
.thy:hover{color:#2a2a2a;filter:brightness(1.05)}
/* sign up / log in */
dialog.adlg{max-width:880px;width:94vw;padding:0;overflow:hidden;border-radius:18px}
dialog.adlg[open]{display:grid;grid-template-columns:1fr 1fr}
.apr{background:linear-gradient(165deg,#d9600f,#b8420a);color:#fff;padding:34px 30px}
.apr h2{margin:0 0 6px;font-size:28px;line-height:1.15}
.apr .sub{margin:0 0 26px;font-size:16px;font-weight:600}
.af{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.af .ic{flex:none;width:76px;height:76px;border-radius:50%;background:#fff3e6;border:5px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center}
.af .ic svg{width:42px;height:42px}
.af b{display:block;font-size:19px;margin-bottom:3px}
.af span{font-size:14px;line-height:1.45;font-weight:600}
.apl{padding:30px 32px 26px;position:relative}
.aclose{position:absolute;top:12px;right:14px;width:34px;height:34px;padding:0;border-radius:50%;font-size:24px;line-height:1;border:2px solid var(--muted);color:var(--muted)}

.alt{font-size:14px;color:var(--muted)}

 const un=list.filter(x=>!x.own),ow=list.filter(x=>x.own);
 const skins=shCat==="face"?`<div class="sub">${t("sh_skin")}</div><div class="skins">${Object.entries(IT.skin).map(([id,v])=>`<button data-skin="${id}" class="${S.eq.skin===id?"on":""}" style="background:${v[2]}" aria-label="${v[0][L()]}"></button>`).join("")}</div><div class="sub">${t("sh_expr")}</div>`:"";
 $("v-shop").innerHTML=`<div class="shx" style="background-image:linear-gradient(rgba(5,8,30,.3),rgba(5,8,30,.3)),url('data:image/svg+xml,${SHBG}')"><nav class="sbar">${cats.map(c=>`<button data-scat="${c}" aria-pressed="${c===shCat}" aria-label="${t("sh_"+c)}" title="${t("sh_"+c)}">${ICO[c]}</button>`).join("")}</nav><div class="sbody"><div class="spv">${av(S.eq)}</div><div class="shead"><b>${t("sh_"+shCat)}</b><span>${list.length} ${t("sh_items")}</span></div>${skins}<div class="sg">${un.map(card).join("")}</div>${ow.length&&un.length?`<div class="ow">${t("sh_owned")}</div>`:""}<div class="sg">${ow.map(card).join("")}</div></div></div>`}
$("v-shop").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.scat){shCat=d.scat;return renderShop()}
 if(d.skin){S.eq.skin=d.skin;save();head();return renderShop()}
 if(!d.sid)return;
 if(d.sc==="set"){const st=SETS[d.sid];if(!Object.entries(st[2]).every(([k,x])=>isOwn(k,x))){if(S.coins<st[1])return;S.coins-=st[1];for(const[k,x]of Object.entries(st[2]))if(!isOwn(k,x))S.own.push(k+":"+x)}Object.assign(S.eq,st[2])}
 else{const c=d.sc,id=d.sid;if(!isOwn(c,id)){if(S.coins<IT[c][id][1])return;S.coins-=IT[c][id][1];S.own.push(c+":"+id)}S.eq[c]=S.eq[c]===id?Object.keys(IT[c])[0]:id}
 save();head();renderShop()});

function nav(k){if(k==="lessons"){tab="lessons";return go("home")}if(k==="tests")return go("tests");if(k==="games")return go("games");
 if(k==="prog1"||k==="prog2"){progTab=k==="prog1"?"sum":"weak";return go("prog")}if(k==="themes")return openThemes();if(k==="shop"){shCat="set";return go("shop")}}
function go(v){if(view==="test")clearInterval(timer);view=v;
 ["home","test","result","shop","tests","games","prog"].forEach(x=>$("v-"+x).hidden=x!==v);head();
 if(v==="home")renderHome();if(v==="shop")renderShop();if(v==="test")resetTest();if(v==="tests")renderTests();if(v==="prog")renderProg();if(v==="games")gMenu();window.scrollTo(0,0)}

/* test */
let text="",pos=0,typed=[],started=false,done=false,t0=0,timer=null,correct=0,total=0,errs={};
const box=$("text"),hid=$("hid"),stageEl=$("stage");
function resetTest(){clearInterval(timer);TT=mode==="lesson"?(LS[lesson].t||30):(mode==="test"||mode==="ten")?testT:mode==="page"?0:S.time;
 text=gen();pos=0;typed=[];started=false;done=false;correct=0;total=0;errs={};
 $("t").textContent=TT;$("w").textContent=0;box.style.transform="translateY(0)";box.innerHTML="";
 for(const ch of text){const s=document.createElement("span");s.textContent=ch;box.appendChild(s)}
 box.children[0].className="cur";
 if(mode==="lesson"){const n=need(lesson);$("ttl").innerHTML=`<b>${t("lesson")} ${lesson+1}: ${label(lesson,false)}</b>`+(n.a?`<br><span class="small">${t("need").replace("{w}",n.w).replace("{a}",n.a)}</span>`:"")}
 else if(mode==="free")$("ttl").textContent=t("free");
 else $("ttl").textContent=mode==="page"?pageN+" "+t("pWord"):t(mode==="ten"?"tTen":"tTimed")+" · "+mmss(TT);
 buildKB();setHands(text[0]);hid.focus({preventScroll:true})}
const wpmNow=()=>{const m=(Date.now()-t0)/60000;return m>0?Math.round(correct/5/m):0};
function tick(){if(mode==="page"){$("t").textContent=Math.floor((Date.now()-t0)/1000);$("w").textContent=wpmNow();return}
 const left=Math.max(0,TT-Math.floor((Date.now()-t0)/1000));$("t").textContent=left;$("w").textContent=wpmNow();if(left<=0)finish()}
function cert(w,acc){return `<div class="cert"><div class="small">${t("certT")}</div><h3>${esc(S.name||t("guest"))}</h3><p>${w} ${t("wpm")} · ${acc}% ${t("acc")}</p><div class="small">${new Date().toLocaleDateString(S.lang==="ru"?"ru-RU":S.lang==="en"?"en-US":"uz-UZ")}</div></div>`}
function finish(){if(done)return;done=true;clearInterval(timer);
 const el=mode==="page"?Math.max(1,(Date.now()-t0)/1000):TT,w=Math.round(correct/5/(el/60)),acc=total?Math.round(correct/total*100):100;
 let gain=0,msg="",ok=false;
 for(const c in errs)S.err[c]=(S.err[c]||0)+errs[c];
 if(mode==="lesson"){const n=need(lesson);ok=acc>=n.a&&w>=n.w;
  if(ok){msg=LS[lesson].ty==="pers"?t("done"):t("pass");if(!S.passed[lesson]){S.passed[lesson]=1;gain+=LS[lesson].ty==="asm"?30:10;S.unl=Math.max(S.unl,Math.min(lesson+2,LS.length))}}else msg=t("fail")}
 else if(mode==="free"){if(w>=S.goal){gain+=10+(w-S.goal);msg=t("hit")}else msg=t("miss").replace("{n}",S.goal-w)}
 else msg=t("done");
 const nb=Math.floor((S.secs+el)/300)-Math.floor(S.secs/300);gain+=nb*20;if(nb)msg+="<br>"+t("bonus")+": +"+nb*20;
 S.secs+=Math.round(el);S.xp+=correct;S.coins+=gain;S.n++;S.sw+=w;S.sa+=acc;S.maxW=Math.max(S.maxW,w);
 if(acc>=95)S.stars++;if(acc===100)S.stars++;
 const tst=mode==="test"||mode==="page"||mode==="ten";if(tst)S.nt++;touch();
 const bk=mode==="lesson"?"lesson"+lesson:mode==="free"?"free"+TT:mode==="page"?"page"+pageN:(mode==="test"?"timed":"ten")+TT;
 if(w>(S.best[bk]||0))S.best[bk]=w;save();
 go("result");
 $("rw").textContent=w;$("ra").textContent=acc+"%";$("rb").textContent=S.best[bk];$("rc").textContent="+"+gain;$("rmsg").innerHTML=msg;
 $("rcert").innerHTML=tst?cert(w,acc):"";
 $("next").hidden=!(mode==="lesson"&&ok&&lesson+1<LS.length);$("again").focus()}
function put(c){if(done)return;if(!started){started=true;t0=Date.now();timer=setInterval(tick,200)}
 const sp=box.children[pos];if(!sp)return;total++;
 if(c===text[pos]){sp.className="ok";correct++;typed[pos]=1}else{sp.className="bad";typed[pos]=0;if(isL(text[pos]))errs[text[pos]]=(errs[text[pos]]||0)+1}
 pos++;if(box.children[pos])box.children[pos].className="cur";scrollText();setHands(text[pos]);
 if(mode==="page"&&pos>=text.length)finish()}
function back(){if(done||pos===0)return;box.children[pos]&&(box.children[pos].className="");pos--;if(typed[pos])correct--;box.children[pos].className="cur";scrollText();setHands(text[pos])}
function scrollText(){const c=box.children[pos];if(!c)return;const lh=parseFloat(getComputedStyle(box.parentNode).lineHeight);
 box.style.transform="translateY("+(-Math.max(0,Math.floor(c.offsetTop/lh)-1)*lh)+"px)"}
hid.addEventListener("input",()=>{for(const c of hid.value)put(c);hid.value=""});
hid.addEventListener("keydown",e=>{if(e.key==="Backspace"){e.preventDefault();back()}else if(e.key==="Tab"){e.preventDefault();resetTest()}});
hid.addEventListener("blur",()=>stageEl.classList.add("blurred"));
hid.addEventListener("focus",()=>stageEl.classList.remove("blurred"));
stageEl.addEventListener("click",()=>hid.focus());
document.addEventListener("keydown",e=>{if(view==="test"&&!done&&document.activeElement!==hid&&e.key.length===1&&!e.ctrlKey&&!e.metaKey)hid.focus()});

/* clicks */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
 if(b.id==="logo")return go("home");
 if(d.nav)return nav(d.nav);
 if(d.grade){S.grade=+d.grade;save();head();if(view==="home")renderHome();return}
 if(d.dlg)return openDlg(d.dlg);
 if(d.prof!==undefined){dlg.close();return useProfile(d.prof,false)}
 if(b.id==="dsave"){const n=$("dname").value.trim().slice(0,20);if(n){dlg.close();useProfile(n,true)}return}
 if(b.id==="dclose")return dlg.close();
 if(d.tm){mode=d.tm==="timed"?"test":d.tm;if(d.tm==="page")pageN=+d.tv;else testT=+d.tv;return go("test")}
 if(d.ptab){progTab=d.ptab;return renderProg()}
 if(d.game)return gOpen(d.game);
 if(b.id==="gback")return gMenu();
 if(b.id==="gstart")return gStart();
 if(d.tab){tab=d.tab;return renderHome()}
 if(b.id==="start"){mode="free";return go("test")}
 if(b.id==="again")return go("test");
 if(b.id==="next"){lesson++;return go("test")}
 if(b.id==="kbt"){S.kb=!S.kb;save();$("kb").hidden=!S.kb;return hid.focus()}
 if(d.lesson!==undefined){mode="lesson";lesson=+d.lesson;return go("test")}
 if(d.lang){S.lang=d.lang;save();head();if(view==="home")renderHome();if(view==="shop")renderShop();if(view==="tests")renderTests();if(view==="prog")renderProg();if(view==="games")gMenu();if(view==="test")resetTest();return}
 if(d.goal){S.goal=+d.goal;save();return renderHome()}
 if(d.time){S.time=+d.time;save();return renderHome()}
 if(d.cat){cat=d.cat;return renderShop()}
 if(d.act){const price=IT[cat][d.id][1],key=cat+":"+d.id;
  if(d.act==="buy"&&S.coins>=price&&!S.own.includes(key)){S.coins-=price;S.own.push(key)}
  if(S.own.includes(key)){S.eq[cat]=d.id;applyTheme()}
  save();head();renderShop()}});
applyTheme();go("home");
</script>
<script src="animation.js"></script>
